<section id="yearend" class="event-section event-yearend section-transition transition-top transition-bottom">
  <div class="event-background"></div>
  <div class="event-overlay"></div>
  
  <div class="event-content">
    <div class="event-container">
      <div class="event-layout">
        <div class="event-image-wrapper reveal-left">
          <img src="asset/image/Model/Year end.JPG" alt="Year End Party" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'width:100%;height:400px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);background:var(--bg-card);border-radius:var(--radius-lg);\'>Year End Party</div>';">
        </div>
        
        <div class="event-info reveal-right">
          <h2 class="event-title" data-i18n="events.yearend.title">Year End Party</h2>
          <p class="event-subtitle" data-i18n="events.yearend.subtitle">Tiệc cuối năm ấm áp, đầy cảm xúc</p>
          
          <ul class="event-usp">
            <li class="event-accent" data-i18n="events.yearend.usp_1">Tạo không khí ấm cúng, gắn kết team và khách hàng</li>
            <li class="event-accent" data-i18n="events.yearend.usp_2">Phong cách thân thiện, vui vẻ, phù hợp tổng kết năm</li>
            <li class="event-accent" data-i18n="events.yearend.usp_3">Kết hợp giải trí và cảm xúc, tạo kỷ niệm đáng nhớ</li>
          </ul>
          
          <div class="event-actions">
            <button class="btn btn-primary" data-gallery="yearend" data-i18n="events.yearend.btn_gallery">Xem hình ảnh</button>
            <button class="btn btn-outline" data-video="yearend" data-i18n="events.yearend.btn_video">Xem video</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
