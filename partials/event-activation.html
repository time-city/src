<section id="activation" class="event-section event-activation">
  <div class="event-background"></div>
  <div class="event-overlay"></div>
  
  <div class="event-content">
    <div class="event-container">
      <div class="event-layout">
        <div class="event-image-wrapper reveal-left">
          <img src="../asset/image/Model/Activation event.JPG" alt="Activation Event" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'width:100%;height:400px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);background:var(--bg-card);border-radius:var(--radius-lg);\'>Activation Event</div>';">
        </div>
        
        <div class="event-info reveal-right">
          <h2 class="event-title">Activation Event</h2>
          <p class="event-subtitle">Sự kiện kích hoạt thương hiệu với năng lượng cao</p>
          
          <ul class="event-usp">
            <li class="event-accent">Tạo buzz và tương tác mạnh mẽ với khách hàng</li>
            <li class="event-accent">Phong cách năng động, hiện đại, phù hợp giới trẻ</li>
            <li class="event-accent">Kết hợp MC chuyên nghiệp với hoạt động tương tác</li>
          </ul>
          
          <div class="event-actions">
            <button class="btn btn-primary" data-gallery="activation">Xem hình ảnh</button>
            <button class="btn btn-outline" data-video="activation">Xem video</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
