<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MC Thanh Tiến - Professional Master of Ceremonies">
  <title>MC Thanh Tiến - Professional MC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=MonteCarlo&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- CSS Split Files -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/hero.css">
  <link rel="stylesheet" href="styles/about.css">
  <link rel="stylesheet" href="styles/events.css">
  <link rel="stylesheet" href="styles/clients.css">
  <link rel="stylesheet" href="styles/contact.css">
  <link rel="stylesheet" href="styles/animations.css">
</head>

<body>
  <main id="main-content">
    <!-- Các section sẽ được đặt trực tiếp ở đây hoặc load qua JS -->
    <!-- Hiện tại tôi giữ cấu trúc phẳng để đảm bảo SEO và tốc độ load -->

    <!-- Hero Section -->
    <div id="hero-placeholder"></div>

    <!-- About Section -->
    <div id="about-placeholder"></div>

    <div id="activation-1-placeholder"></div>
    <div id="activation-2-placeholder"></div>
    <div id="activation-3-placeholder"></div>

    <div id="gala-1-placeholder"></div>
    <div id="gala-2-placeholder"></div>
    <div id="gala-3-placeholder"></div>
    <div id="gala-4-placeholder"></div>
    <div id="gala-video-placeholder"></div>

    <div id="client-meeting-1-placeholder"></div>

    <div id="yearend-1-placeholder"></div>
    <div id="yearend-2-placeholder"></div>

    <div id="teambuilding-1-placeholder"></div>
    <div id="teambuilding-2-placeholder"></div>
    <div id="teambuilding-3-placeholder"></div>

    <!-- Other Events Section -->
    <div id="other-events-placeholder"></div>

    <!-- Other Videos Section -->
    <div id="other-videos-placeholder"></div>

    <!-- Clients Section -->
    <div id="clients-placeholder"></div>

    <!-- Thank You Section -->
    <div id="thankyou-placeholder"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 MC Thanh Tiến. All rights reserved.</p>
    </div>
  </footer>

  <!-- UI Components -->
  <button id="scroll-top" class="scroll-top" aria-label="Scroll to top">↑</button>

  <div id="page-loader" class="page-loader">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <p class="loader-text">Đang tải...</p>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // Simple loader to inject sections if they are separated
    // For production, it's better to keep them in index.html for SEO
    async function loadSection(id, path) {
      const placeholder = document.getElementById(id + '-placeholder');
      if (placeholder) {
        try {
          // Thêm query string thời gian để tránh cache trình duyệt
          const response = await fetch('sections/' + path + '?v=' + Date.now());
          const html = await response.text();
          placeholder.innerHTML = html;
        } catch (e) {
          console.error('Error loading section:', path, e);
        }
      }
    }

    // Load sections
    Promise.all([
      loadSection('hero', 'hero.html'),
      loadSection('about', 'about.html'),
      loadSection('activation-1', 'activation-1.html'),
      loadSection('activation-2', 'activation-2.html'),
      loadSection('activation-3', 'activation-3.html'),
      loadSection('gala-1', 'gala-1.html'),
      loadSection('gala-2', 'gala-2.html'),
      loadSection('gala-3', 'gala-3.html'),
      loadSection('gala-4', 'gala-4.html'),
      loadSection('gala-video', 'gala-video.html'),
      loadSection('client-meeting-1', 'client-meeting-1.html'),
      loadSection('yearend-1', 'yearend-1.html'),
      loadSection('yearend-2', 'yearend-2.html'),
      loadSection('teambuilding-1', 'teambuilding-1.html'),
      loadSection('teambuilding-2', 'teambuilding-2.html'),
      loadSection('teambuilding-3', 'teambuilding-3.html'),
      loadSection('other-events', 'other-events.html'),
      loadSection('other-videos', 'other-videos.html'),
      loadSection('clients', 'clients.html'),
      loadSection('thankyou', 'thankyou.html')
    ]).then(() => {
      console.log('Tất cả section đã được tải');
      // Khởi tạo các hiệu ứng sau khi các section đã được tải xong
      if (window.initMCProfile) {
        window.initMCProfile();
      }
    }).catch(err => {
      console.error('Lỗi khi tải các section:', err);
      // Vẫn cố gắng ẩn loader nếu có lỗi để người dùng không bị kẹt
      if (window.initMCProfile) {
        window.initMCProfile();
      }
    });
  </script>
</body>

</html>
