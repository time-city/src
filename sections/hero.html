<!-- Hero Section -->
<section id="hero" class="section hero-section">
  <!-- Background Video -->
  <div class="hero-media">
    <video class="hero-video" autoplay muted loop playsinline preload="metadata" poster="asset/image/background/image.png">
      <source src="asset/video/hero.mp4" type="video/mp4">
      <!-- Fallback if hero.mp4 not found, use existing one -->
      <source src="asset/video/Activation%20Event.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
  </div>

  <div class="container">
    <div class="hero-content">
      <div class="hero-text">
        <h1 class="hero-title animate-in" style="animation-delay: 0.2s;">Thanh Tiến</h1>
        <p class="hero-subtitle animate-in" style="animation-delay: 0.4s;">MC Event</p>
        
        <div class="hero-quote animate-in" style="animation-delay: 0.6s;">
          <p>"Tôi tin rằng, mỗi khoảnh khắc trên sân khấu <br>
          là một cơ hội để chạm đến trái tim người nghe."</p>
        </div>
        
        <!-- <div class="hero-actions animate-in" style="animation-delay: 0.8s;">
          <a class="btn btn-primary" href="#contact">Liên hệ ngay</a>
        </div> -->
      </div>
      
      <div class="hero-visual animate-in" aria-hidden="true" style="animation-delay: 0.5s;">
        <div class="hero-frame">
          <img class="hero-photo" src="asset/image/Model/hero2.png" alt="MC Thanh Tiến" loading="eager" decoding="async">
        </div>
      </div>
    </div>
  </div>
</section>
