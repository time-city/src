<!-- Hero Section -->
<section id="hero" class="section hero-section">
  <div class="bg-layer" style="background-image: url('asset/image/background/bg_1.png');"></div>
  <div class="overlay"></div>
  <div class="container">
    <div class="hero-content">
      <div class="hero-text">
        <h1 class="hero-title animate-in" style="animation-delay: 0.2s;">MC Thanh Tiến</h1>
        <p class="hero-tagline animate-in" style="animation-delay: 0.4s;">MC Event • Gala • Year End Party</p>
        <div class="hero-quote animate-in" style="animation-delay: 0.6s;">
          "Tôi tin rằng, mỗi khoảnh khắc trên sân khấu <br>
          <span class="highlight">là một cơ hội để chạm đến trái tim người nghe."</span>
        </div>
        <div class="hero-actions animate-in" style="animation-delay: 0.8s;">
          <a class="btn btn-primary" href="tel:+840902174751">Liên hệ ngay</a>
        </div>
        <div class="hero-stats animate-in" style="animation-delay: 1s;">
          <div class="stat-item">
            <span class="stat-number" data-count-to="700" data-suffix="+">700+</span>
            <span class="stat-label">Chương trình</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" data-count-to="4" data-suffix="+">4+</span>
            <span class="stat-label">Năm kinh nghiệm</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" data-count-to="200" data-suffix="+">200+</span>
            <span class="stat-label">Đối tác</span>
          </div>
        </div>
      </div>
      <div class="hero-visual animate-in" aria-hidden="true" style="animation-delay: 0.5s;">
        <div class="hero-frame">
          <img class="hero-photo" src="asset/image/Model/hero.png" alt="MC Thanh Tiến" loading="eager" decoding="async">
        </div>
      </div>
    </div>
  </div>
</section>
